# =============================================================================
# Campus+ — Supabase CLI project configuration (local development only)
# =============================================================================
# This file configures the *local* Supabase stack used by `supabase start`,
# `supabase db reset` and `supabase test db`. Production is your hosted project;
# point the CLI at it with `supabase link --project-ref <ref>` and deploy with
# `supabase db push`.
#
# The database schema itself lives in supabase/migrations/ — one authoritative,
# ordered history. Nothing else creates or alters production objects.
# =============================================================================

project_id = "campus-plus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# The App Router talks to Postgres through PostgREST; RLS + column privileges
# are the authorization boundary, so no table is hidden from the API on purpose.
db_schema = ["public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = false
# Campus+ is passwordless even locally: the only auth method is an email OTP.
enable_signup_confirmation = false
double_confirm_changes = false

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = false

[realtime]
enabled = true

[analytics]
enabled = false
